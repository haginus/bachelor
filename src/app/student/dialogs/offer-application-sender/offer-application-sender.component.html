@if(isLoadingQuery) {
  <div class="loading-shade">
    <mat-progress-bar mode="query"></mat-progress-bar>
  </div>
}

<h2 i18n mat-dialog-title>Aplicați la această ofertă</h2>

<mat-dialog-content class="mat-typography">
  <form [formGroup]="applicationForm">
    <mat-form-field subscriptSizing="fixed">
      <mat-label i18n>Titlu lucrare</mat-label>
      <input matInput type="text" formControlName="title">
      <mat-error i18n>
        Titlul trebuie să fie de lungime între 3 și 256 caractere.
      </mat-error>
    </mat-form-field>
    <mat-form-field subscriptSizing="fixed">
      <mat-label i18n>Descriere lucrare</mat-label>
      <textarea matInput type="text" formControlName="description"></textarea>
      <mat-error i18n>
        Descrierea trebuie să fie de lungime între 64 și 1024 caractere.
      </mat-error>
    </mat-form-field>
    <mat-form-field subscriptSizing="fixed">
      <mat-label i18n>Tehnologii folosite</mat-label>
      <input matInput type="text" formControlName="usedTechnologies">
      <mat-error i18n>
        Acest câmp poate avea maximum 256 de caractere.
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button i18n mat-button mat-dialog-close>Anulați</button>
  <button i18n mat-button (click)="applyToOffer()" [disabled]="applicationForm.invalid">
    Aplicați
  </button>
</mat-dialog-actions>
